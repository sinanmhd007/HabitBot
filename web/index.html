<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="habitbot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    body {
      background-color: #F8F8F8;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      color: #6C63FF;
    }
    .spinner {
      border: 6px solid rgba(108, 99, 255, 0.2);
      border-top: 6px solid #6C63FF;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <title>habitbot</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <h3>Loading HabitBot...</h3>
  </div>
  <script>
    window.addEventListener('load', function(ev) {
      // The flutter_bootstrap.js handles the initialization.
      // Once flutter is ready, it draws over the body. We can just leave the loader or remove it.
      // Flutter will automatically render on top of it, but we can hide it after a delay.
      setTimeout(() => {
        const loader = document.getElementById('loading');
        if (loader) loader.style.display = 'none';
      }, 5000); // Failsafe removal
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
